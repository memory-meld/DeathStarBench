---
apiVersion: v1
kind: Service
metadata:
  name: url-shorten-memcached
  labels:
    death-star-project: social-network
    app: url-shorten-memcached
  namespace: social-network
spec:
  ports:
  - port: 11211
  selector:
    death-star-project: social-network
    app: url-shorten-memcached
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shorten-memcached
  labels:
    death-star-project: social-network
    app: url-shorten-memcached
  namespace: social-network
spec:
  replicas: 1
  selector:
    matchLabels:
      death-star-project: social-network
      app: url-shorten-memcached
  template:
    metadata:
      labels:
        death-star-project: social-network
        app: url-shorten-memcached
      name: url-shorten-memcached
    spec:
      runtimeClassName: kata-fc
      containers:
      - name: url-shorten-memcached
        image: memcached
        env:
        - name: GUEST_IMAGE
          value: docker.io/library/memcached:latest
        - name: GUEST_PORT
          value: "11211"
        - name: K_REVISION
          value: url-shorten-memcached-00001
      restartPolicy: Always
