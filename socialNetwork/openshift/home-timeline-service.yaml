---
apiVersion: v1
kind: Service
metadata:
  name: home-timeline-service
  labels:
    death-star-project: social-network
    app: home-timeline-service
  namespace: social-network
spec:
  ports:
  - port: 9090
  selector:
    death-star-project: social-network
    app: home-timeline-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-timeline-service
  labels:
    death-star-project: social-network
    app: home-timeline-service
  namespace: social-network
spec:
  replicas: 1
  selector:
    matchLabels:
      death-star-project: social-network
      app: home-timeline-service
  template:
    metadata:
      labels:
        death-star-project: social-network
        app: home-timeline-service
      name: home-timeline-service
    spec:
      containers:
      - name: home-timeline-service
        image: deathstarbench/social-network-microservices
        env:
        - name: GUEST_IMAGE
          value: docker.io/deathstarbench/social-network-microservices:latest
        - name: GUEST_PORT
          value: "9090"
        - name: K_REVISION
          value: home-timeline-service-00001
        command: ["HomeTimelineService"]
        volumeMounts:
          - mountPath: /social-network-microservices/config/jaeger-config.yml
            subPath: jaeger-config.yml
            name: jaeger-conf-yaml
          - mountPath: /social-network-microservices/config/service-config.json
            subPath: service-config.json
            name: service-conf-json
      restartPolicy: Always
      volumes:
        - name: jaeger-conf-yaml
          configMap:
            name: jaeger-config-yaml
        - name: service-conf-json
          configMap:
            name: service-config-json
