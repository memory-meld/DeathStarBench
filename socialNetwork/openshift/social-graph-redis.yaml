---
apiVersion: v1
kind: Service
metadata:
  name: social-graph-redis
  labels:
    death-star-project: social-network
    app: social-graph-redis
  namespace: social-network
spec:
  ports:
  - port: 6379
  selector:
    death-star-project: social-network
    app: social-graph-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-graph-redis
  labels:
    death-star-project: social-network
    app: social-graph-redis
  namespace: social-network
spec:
  replicas: 1
  selector:
    matchLabels:
      death-star-project: social-network
      app: social-graph-redis
  template:
    metadata:
      labels:
        death-star-project: social-network
        app: social-graph-redis
      name: social-graph-redis
    spec:
      runtimeClassName: kata-fc
      containers:
      - name: social-graph-redis
        image: redis
        env:
        - name: GUEST_IMAGE
          value: docker.io/library/redis:latest
        - name: GUEST_PORT
          value: "6379"
        - name: K_REVISION
          value: social-graph-redis-00001
      restartPolicy: Always
